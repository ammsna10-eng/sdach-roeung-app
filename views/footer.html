    <!-- 📺 FULLSCREEN VIDEO PLAYER MODAL -->
    <div v-if="isPlayerOpen" class="fixed inset-0 z-50 bg-black flex flex-col justify-center items-center">
      <div class="relative w-full max-w-4xl aspect-video bg-black flex items-center justify-center overflow-hidden">
        <!-- Video element configured for iOS Safari & WebKit inline playback -->
        <video 
          id="sdach-video-player" 
          :src="activeStreamUrl" 
          controls 
          playsinline 
          webkit-playsinline 
          x5-playsinline
          preload="auto" 
          class="w-full h-full object-contain"
          @error="onVideoError"
        ></video>

        <!-- Tap to play overlay when iOS Safari blocks unmuted programmatic autoplay -->
        <div v-if="isVideoBlocked" @click="resumePlayback" class="absolute inset-0 bg-black/75 backdrop-blur-sm flex flex-col items-center justify-center cursor-pointer z-10 space-y-3">
          <div class="w-16 h-16 rounded-full bg-red-600 flex items-center justify-center text-white text-2xl shadow-2xl shadow-red-500/50 transform hover:scale-110 active:scale-95 transition-all">
            ▶
          </div>
          <span class="text-white text-xs font-bold bg-black/80 px-4 py-2 rounded-full border border-white/20">ចុចទីនេះដើម្បីទស្សនា (Tap to Play)</span>
        </div>

        <!-- Video playback error overlay with retry option -->
        <div v-if="videoErrorMessage" class="absolute inset-0 bg-black/90 p-6 flex flex-col items-center justify-center text-center z-20 space-y-3">
          <span class="text-4xl">⚠️</span>
          <p class="text-white text-sm font-bold max-w-sm">{{ videoErrorMessage }}</p>
          <div class="flex gap-2 pt-2">
            <button @click="retryPlay" class="px-4 py-2 rounded-xl bg-amber-500 text-black text-xs font-bold active:scale-95">ព្យាយាមម្ដងទៀត (Retry)</button>
            <button @click="closePlayer" class="px-4 py-2 rounded-xl bg-white/20 text-white text-xs font-bold active:scale-95">បិទ</button>
          </div>
        </div>

        <!-- Close Player Button -->
        <button @click="closePlayer" class="absolute top-4 right-4 z-30 px-3.5 py-1.5 rounded-xl bg-black/80 backdrop-blur-md text-white text-xs font-bold border border-white/20 active:scale-95">
          ✕ បិទវីដេអូ
        </button>
      </div>
    </div>

    <!-- 💳 TOPUP / VIP QR MODAL -->
    <div v-if="isQrModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-xl">
      <div class="relative w-full max-w-sm rounded-3xl bg-[#120a21] border border-amber-500/30 p-6 text-center space-y-4 shadow-2xl">
        <button @click="isQrModalOpen = false" class="absolute top-4 right-4 text-slate-400 hover:text-white text-sm font-bold">✕</button>
        <h3 class="text-lg font-bold text-white">{{ qrModalData.title }}</h3>
        
        <div class="w-56 h-56 mx-auto rounded-2xl bg-white p-2.5 shadow-xl flex items-center justify-center">
          <img :src="qrModalData.qr" alt="KHQR" class="w-full h-full object-contain">
        </div>

        <div class="text-sm font-mono text-amber-300 font-bold">
          ចំនួនទឹកប្រាក់៖ ${{ (qrModalData.amount || 0).toFixed(2) }}
        </div>

        <!-- Action: Save QR Image Button for Mobile Users -->
        <button @click="downloadQR(qrModalData.qr, 'KHQR_' + qrModalData.amount + 'USD.png')" class="w-full py-2.5 px-3 rounded-xl bg-gradient-to-r from-amber-500/20 to-yellow-500/20 hover:bg-amber-500/30 border border-amber-400/50 text-amber-300 font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition-all shadow">
          <span>📥 រក្សាទុករូបភាព QR ក្នុងទូរស័ព្ទ</span>
        </button>

        <p class="text-[11px] text-slate-400 leading-relaxed">
          💡 សម្រាប់ទូរស័ព្ទដៃ៖ ចុច «រក្សាទុក QR» រួចចូល App ABA/Bakong ចុចស្កេន ដោយជ្រើសរើសរូបភាពពី Gallery ជាការស្រេច!
        </p>

        <button @click="isQrModalOpen = false; showNotify('សំណើបានផ្ញើទៅ Admin រួចរាល់!', 'success')" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-black font-extrabold text-xs shadow-lg active:scale-95">
          ខ្ញុំបានបង់ប្រាក់រួចរាល់
        </button>
      </div>
    </div>

    <!-- 🔔 TOAST NOTIFICATION -->
    <div v-if="notification.show" class="fixed top-5 inset-x-0 z-50 flex justify-center px-4 pointer-events-none">
      <div :class="notification.type === 'success' ? 'bg-emerald-500 text-black' : 'bg-rose-500 text-white'" class="px-5 py-2.5 rounded-2xl font-bold text-xs shadow-2xl transition-all">
        {{ notification.message }}
      </div>
    </div>

  </div> <!-- End #app -->

  <!-- App Script -->
  <script src="/js/app.js?v=20261111_04"></script>
</body>
</html>
