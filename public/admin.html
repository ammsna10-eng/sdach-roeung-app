    <!-- Dev/Browser Testing Polyfill for Telegram WebApp -->
    <!-- NOTE: no mock initData is injected anymore; unsigned initData is
         rejected server-side (HMAC verification) unless ALLOW_DEV_LOGIN=true -->
    <script>
      (function() {
        if (!window.Telegram) window.Telegram = {};
        if (!window.Telegram.WebApp || !window.Telegram.WebApp.initData) {
          var isRouteAdmin = window.location.pathname.startsWith('/admin') || window.location.pathname.startsWith('/super_admin');
          if (!isRouteAdmin) {
            window.Telegram.WebApp = {
              initData: "",
              initDataUnsafe: {
                user: null
              },
              ready: function() {},
              expand: function() {},
              close: function() {},
              requestFullscreen: function() {},
              exitFullscreen: function() {},
              HapticFeedback: {
                impactOccurred: function() {},
                notificationOccurred: function() {},
                selectionChanged: function() {}
              },
              openLink: function(url) { window.open(url, '_blank'); },
              openTelegramLink: function(url) { window.open(url, '_blank'); },
              downloadFile: function(params, cb) {
                var a = document.createElement('a');
                a.href = params.url;
                a.download = params.file_name || 'download';
                a.click();
                if (cb) cb(true);
              }
            };
          }
        }
      })();
    </script>

    <!-- Application Bundle -->
    <!-- 🖼️ Helper script for Direct Poster Upload & Image Paste in Admin Panel -->
    <script>
      (function() {
        var origOpen = XMLHttpRequest.prototype.open;
        var origSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function(method, url) {
          this._reqMethod = method;
          this._reqUrl = url;
          return origOpen.apply(this, arguments);
        };
        XMLHttpRequest.prototype.send = function(body) {
          if (this._reqMethod === 'POST' && this._reqUrl && this._reqUrl.includes('/admin/data/movies') && !this._reqUrl.includes('/broadcast-telegram') && typeof body === 'string') {
            var chk = document.getElementById('auto-broadcast-telegram-checkbox');
            if (chk) {
              try {
                var parsed = JSON.parse(body);
                parsed.is_send_to_channel = chk.checked;
                parsed.broadcast = chk.checked;
                parsed.notify_telegram = chk.checked;
                body = JSON.stringify(parsed);
              } catch (e) {}
            }
          }
          return origSend.call(this, body);
        };
      })();

      document.addEventListener('DOMContentLoaded', function() {
        // Observe DOM for poster inputs and attach file upload / paste helpers
        var observer = new MutationObserver(function() {
          var posterInputs = document.querySelectorAll('input[type="url"]');
          posterInputs.forEach(function(input) {
            var label = input.previousElementSibling;
            if (label && (label.innerText.includes('Poster') || label.innerText.includes('Backdrop')) && !input.dataset.hasUploader) {
              input.dataset.hasUploader = 'true';
              
              var container = document.createElement('div');
              container.className = 'mt-2 flex items-center gap-2 text-xs';
              container.innerHTML = '<label class="cursor-pointer px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-bold transition-all shadow flex items-center gap-1.5"><span>📁 រើសរូបពីកុំព្យូទ័រ (Upload)</span><input type="file" accept="image/*" class="hidden"></label><span class="text-gray-400 text-[11px]">(ឬ Copy រូបភាពរួចចុច Ctrl + V ដើម្បី Paste ក៏បាន)</span>';
              
              var fileInput = container.querySelector('input[type="file"]');
              fileInput.addEventListener('change', function(e) {
                if (!e.target.files || !e.target.files[0]) return;
                uploadFile(e.target.files[0], input);
              });
              
              input.parentNode.appendChild(container);

              // Allow paste image directly when focusing input
              input.addEventListener('paste', function(e) {
                var items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (var i = 0; i < items.length; i++) {
                  if (items[i].type.indexOf('image') !== -1) {
                    var blob = items[i].getAsFile();
                    uploadFile(blob, input);
                    e.preventDefault();
                    break;
                  }
                }
              });
            }
          });
          // Auto Broadcast Toggle Switch in Movie Form Modal
          var overviewTextarea = document.querySelector('textarea');
          if (overviewTextarea && !document.getElementById('tg-broadcast-toggle-wrapper')) {
            var toggleBox = document.createElement('div');
            toggleBox.id = 'tg-broadcast-toggle-wrapper';
            toggleBox.className = 'p-3 my-3 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-between text-left';
            toggleBox.innerHTML = 
              '<div class="flex items-center gap-2.5">' +
                '<span class="text-xl">📢</span>' +
                '<div>' +
                  '<div class="text-xs font-bold text-amber-300">ផ្ញើដំណឹងរឿងថ្មីនេះទៅ Telegram ស្វ័យប្រវត្តិ (Broadcast)</div>' +
                  '<div class="text-[11px] text-gray-400">ផ្ញើ Poster + ចំណងជើង + ប៊ូតុងទស្សនា ទៅកាន់សមាជិកទាំងអស់</div>' +
                '</div>' +
              '</div>' +
              '<label class="relative inline-flex items-center cursor-pointer ml-3 shrink-0">' +
                '<input type="checkbox" id="auto-broadcast-telegram-checkbox" class="sr-only peer" checked>' +
                '<div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[\'\'] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>' +
              '</label>';

            if (overviewTextarea.parentNode && overviewTextarea.parentNode.parentNode) {
              overviewTextarea.parentNode.parentNode.insertBefore(toggleBox, overviewTextarea.parentNode.nextSibling);
            }
          }

        });

        observer.observe(document.body, { childList: true, subtree: true });

        function uploadFile(file, targetInput) {
          var formData = new FormData();
          formData.append('poster', file);
          var originalPlaceholder = targetInput.placeholder;
          targetInput.placeholder = 'កំពុង Upload រូបភាព... សូមរង់ចាំ';
          targetInput.disabled = true;

          fetch('/admin/data/upload-poster', {
            method: 'POST',
            body: formData
          })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            targetInput.disabled = false;
            targetInput.placeholder = originalPlaceholder;
            if (data.url) {
              targetInput.value = data.url;
              targetInput.dispatchEvent(new Event('input', { bubbles: true }));
              targetInput.dispatchEvent(new Event('change', { bubbles: true }));
            }
          })
          .catch(function(err) {
            targetInput.disabled = false;
            targetInput.placeholder = originalPlaceholder;
            alert('Upload បរាជ័យ៖ ' + err.message);
          });
        }
      });
    </script>

          '.sr-badge.purchased{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.4)}',
          '.sr-badge.free{background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.4)}',
          '.sr-badge.bypass{background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.6);animation:srFlash 1s infinite}',
          '@keyframes srFlash{0%,100%{opacity:1}50%{opacity:.35}}',
          '.sr-revoke{background:#dc2626;color:#fff;border:none;border-radius:8px;padding:3px 10px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap}',
          '.sr-revoke:hover{background:#ef4444}',
          '.sr-log{display:flex;gap:10px;padding:8px;border-radius:10px;margin-bottom:6px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);font-size:11px;align-items:center}',
          '.sr-log.type-BYPASS_ATTEMPT{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.06)}',
          '.sr-log.type-FAKE_INIT_DATA,.sr-log.type-TOKEN_SHARING,.sr-log.type-UNAUTHORIZED_STREAM{border-color:rgba(245,158,11,.4)}',
          '.sr-log-time{color:#9ca3af;white-space:nowrap;font-size:10px}',
          '.sr-log-type{font-weight:800;white-space:nowrap}',
          '.sr-log-detail{color:#d1d5db;flex:1}',
          '.sr-empty{color:#6b7280;font-size:11px;padding:10px;text-align:center}',
          '.sr-login-box{max-width:340px;margin:60px auto;background:#0d0a18;border:1px solid rgba(245,158,11,.4);border-radius:16px;padding:24px}',
          '.sr-login-box input{width:100%;box-sizing:border-box;margin-bottom:10px;background:#161128;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px;color:#fff;font-size:12px}',
          '.sr-login-btn{width:100%;background:linear-gradient(135deg,#fbbf24,#d97706);color:#0b0706;border:none;border-radius:10px;padding:10px;font-weight:800;cursor:pointer;font-size:12px}',
          '.sr-err{color:#f87171;font-size:11px;margin-top:8px}'
        ].join('\n');

        var style = document.createElement('style');
        style.textContent = CSS;
        document.head.appendChild(style);

        function isActiveArea() {
          return window.location.pathname.indexOf('/super_admin') === 0;
        }

        function ensureButton() {
          if (!isActiveArea()) return;
          if (document.getElementById('sr-sec-open-btn')) return;
          var btn = document.createElement('button');
          btn.id = 'sr-sec-open-btn';
          btn.className = 'sr-sec-btn';
          btn.innerHTML = '🛡 តាមដាន & សុវត្ថិភាព';
          btn.addEventListener('click', openPanel);
          document.body.appendChild(btn);
        }

        // Try to add a sidebar entry styled like the built-in Super Admin links
        function injectSidebarItem() {
          if (!isActiveArea()) return;
          var anchor = document.querySelector('a[href="/super_admin/comments"]');
          if (!anchor || document.getElementById('sr-sec-nav-item')) return;
          var item = document.createElement('a');
          item.id = 'sr-sec-nav-item';
          item.href = '#';
          item.className = 'flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800/50 rounded-xl border border-transparent transition-all';
          item.style.fontSize = '14px';
          item.style.fontWeight = '700';
          item.innerHTML = '<span style="width:20px;display:inline-block;margin-right:12px">🛡</span> តាមដាន & សុវត្ថិភាព';
          item.addEventListener('click', function(e) {
            e.preventDefault();
            openPanel();
          });
          anchor.parentNode.insertBefore(item, anchor.nextSibling);
        }

        var mo = new MutationObserver(function() {
          ensureButton();
          injectSidebarItem();
        });
        mo.observe(document.body, { childList: true, subtree: true });
        setInterval(function() { ensureButton(); injectSidebarItem(); }, 1500);

        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }

        function statusBadge(status) {
          if (status === 'VIP') return '<span class="sr-badge vip">VIP 👑</span>';
          if (status === 'PURCHASED') return '<span class="sr-badge purchased">បានទិញ</span>';
          if (status === 'BYPASS_ATTEMPT') return '<span class="sr-badge bypass">🚨 Bypass Attempt</span>';
          return '<span class="sr-badge free">ហ្វ្រី</span>';
        }

        function logTypeLabel(type) {
          var map = {
            'BYPASS_ATTEMPT': '<span style="color:#f87171">🚨 BYPASS_ATTEMPT</span>',
            'FAKE_INIT_DATA': '<span style="color:#fbbf24">FAKE_INIT_DATA</span>',
            'TOKEN_SHARING': '<span style="color:#fbbf24">TOKEN_SHARING</span>',
            'UNAUTHORIZED_STREAM': '<span style="color:#fbbf24">UNAUTHORIZED_STREAM</span>',
            'INVALID_STREAM_SIG': '<span style="color:#fbbf24">INVALID_STREAM_SIG</span>',
            'SESSION_REVOKED': '<span style="color:#34d399">SESSION_REVOKED</span>',
            'PROXY_ERROR': '<span style="color:#9ca3af">PROXY_ERROR</span>'
          };
          return map[type] || '<span style="color:#9ca3af">' + esc(type) + '</span>';
        }

        function getToken() {
          return sessionStorage.getItem('sr_admin_token') || localStorage.getItem('admin_token') || '';
        }

        function fetchMonitor() {
          var token = getToken();
          return fetch('/super_admin/api/security-monitor', {
            headers: { 'x-admin-token': token }
          }).then(function(r) {
            if (r.status === 403) throw new Error('auth');
            return r.json();
          });
        }

          var token = getToken();
          return fetch('/super_admin/api/users/' + encodeURIComponent(userId) + '/revoke-session', {
            method: 'POST',
            headers: { 'x-admin-token': token }
          }).then(function(r) { return r.json(); });

              '<div id="sr-sec-watchers"><div class="sr-empty">កំពុងផ្ទុក...</div></div>' +
              '<h3>🚨 កំណត់ហេតុសុវត្ថិភាព & ការព្យាយាមដោះស្រាច (Security & Bypass Logs)</h3>' +
              '<div id="sr-sec-logs"><div class="sr-empty">កំពុងផ្ទុក...</div></div>' +
            '</div>';
          document.body.appendChild(panelEl);
          panelEl.querySelector('#sr-sec-close').addEventListener('click', closePanel);
          panelEl.addEventListener('click', function(e) {
            var btn = e.target.closest('.sr-revoke');
            if (!btn) return;
            var uid = btn.getAttribute('data-uid');
            btn.disabled = true;
            btn.textContent = 'កំពុងលុប...';
            revokeUser(uid).then(function() { refreshNow(); }).catch(function() {
              btn.disabled = false;
              btn.textContent = '🚫 Revoke/Kick';
            });
          });
        }

        function closePanel() {
          if (panelEl) panelEl.classList.remove('open');
          stopPolling();
        }

        function startPolling() {
          stopPolling();
          refreshNow();
          pollTimer = setInterval(refreshNow, 5000);
        }
        function stopPolling() {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }

        function fmtTime(iso) {
          try {
            var d = new Date(iso);
            return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          } catch (e) { return ''; }
        }

        function refreshNow() {
          if (!panelEl || !panelEl.classList.contains('open')) return;
          fetchMonitor().then(function(data) {
            var watchers = data.active_watchers || [];
            var logs = data.security_logs || [];
            var uEl = panelEl.querySelector('#sr-sec-updated');
            if (uEl) uEl.textContent = 'ធ្វើបច្ចុប្បន្នភាព: ' + fmtTime(data.server_time) + ' • អ្នកមើលៈ ' + watchers.length + ' • Logs: ' + logs.length;

            var wEl = panelEl.querySelector('#sr-sec-watchers');
            if (!watchers.length) {
              wEl.innerHTML = '<div class="sr-empty">គ្មានអ្នកកំពុងទស្សនាទេ (ពេលនេះ)</div>';
            } else {
              var rows = watchers.map(function(w) {
                var title = esc(w.movie_title || '') + (w.episode_title ? ' — ' + esc(w.episode_title) : '');
                return '<tr>' +
                  '<td><b>' + esc(w.user_name || 'User') + '</b><br><span style="color:#9ca3af;font-size:10px">ID ' + esc(w.user_id) + '</span></td>' +
                  '<td>' + title + '</td>' +
                  '<td>' + esc(w.ip || '-') + '</td>' +
                  '<td>' + statusBadge(w.status) + '</td>' +
                  '<td style="font-size:10px;color:#9ca3af">' + fmtTime(new Date(w.last_ping).toISOString()) + '</td>' +
                  '<td><button class="sr-revoke" data-uid="' + esc(w.user_id) + '">🚫 Revoke/Kick</button></td>' +
                '</tr>';
              }).join('');
              wEl.innerHTML = '<table class="sr-sec-table"><thead><tr>' +
                '<th>អ្នកប្រើប្រាស់</th><th>រឿង/ភាគ</th><th>IP</th><th>ស្ថានភាព</th><th>Ping</th><th>សកម្មភាព</th>' +
                '</tr></thead><tbody>' + rows + '</tbody></table>';
            }

            var lEl = panelEl.querySelector('#sr-sec-logs');
            if (!logs.length) {
              lEl.innerHTML = '<div class="sr-empty">គ្មានកំណត់ហេតុសុវត្ថិភាពនៅឡើយទេ</div>';
            } else {
              lEl.innerHTML = logs.slice(0, 50).map(function(l) {
                var revokeBtn = l.user_id ? '<button class="sr-revoke" data-uid="' + esc(l.user_id) + '">🚫 Revoke</button>' : '';
                return '<div class="sr-log type-' + esc(l.type) + '">' +
                  '<span class="sr-log-time">' + fmtTime(l.timestamp) + '</span>' +
                  '<span class="sr-log-type">' + logTypeLabel(l.type) + '</span>' +
                  '<span class="sr-log-detail"><b>' + esc(l.user_name || 'N/A') + '</b> (ID ' + esc(l.user_id == null ? '-' : l.user_id) + ', IP ' + esc(l.ip || '-') + ') — ' + esc(l.details || '') + '</span>' +
                  revokeBtn +
                '</div>';
              }).join('');
            }
          }).catch(function(e) {
            if (String(e && e.message) === 'auth') {
              stopPolling();
              if (panelEl) panelEl.remove();
              panelEl = null;
              sessionStorage.removeItem('sr_admin_token');
              openLogin();
            }
          });
        }
      })();
    </script>
</body>
</html>
