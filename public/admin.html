<body class="bg-[#0b0914] text-white selection:bg-amber-500 selection:text-black">
    <!-- Dev Helper Toolbar (moved to bottom right so it doesn't obstruct header) -->
    <div id="dev-nav">
      <span>👑 ស្ដេចរឿង:</span>
      <a href="/">📱 Mini App</a>
      <span>|</span>
      <a href="/admin/login">⚙️ Admin</a>
    </div>

    <div id="app"></div>

    <!-- Application Bundle -->
    <!-- 🖼️ Helper script for Direct Poster Upload & Image Paste in Admin Panel -->
    <script>
      (function() {
        var origOpen = XMLHttpRequest.prototype.open;
        var origSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function(method, url) {
          this._reqMethod = method;
          this._reqUrl = url;
          return origOpen.apply(this, arguments);
        };
        XMLHttpRequest.prototype.send = function(body) {
          if (this._reqMethod === 'POST' && this._reqUrl && this._reqUrl.includes('/admin/data/movies') && !this._reqUrl.includes('/broadcast-telegram') && typeof body === 'string') {
            var chk = document.getElementById('auto-broadcast-telegram-checkbox');
            if (chk) {
              try {
                var parsed = JSON.parse(body);
                parsed.is_send_to_channel = chk.checked;
                parsed.broadcast = chk.checked;
                parsed.notify_telegram = chk.checked;
                body = JSON.stringify(parsed);
              } catch (e) {}
            }
          }
          return origSend.call(this, body);
        };
      })();

      document.addEventListener('DOMContentLoaded', function() {
        // Observe DOM for poster inputs and attach file upload / paste helpers
        var observer = new MutationObserver(function() {
          var posterInputs = document.querySelectorAll('input[type="url"]');
          posterInputs.forEach(function(input) {
            var label = input.previousElementSibling;
            if (label && (label.innerText.includes('Poster') || label.innerText.includes('Backdrop')) && !input.dataset.hasUploader) {
              input.dataset.hasUploader = 'true';
              
              var container = document.createElement('div');
              container.className = 'mt-2 flex items-center gap-2 text-xs';
              container.innerHTML = '<label class="cursor-pointer px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-bold transition-all shadow flex items-center gap-1.5"><span>📁 រើសរូបពីកុំព្យូទ័រ (Upload)</span><input type="file" accept="image/*" class="hidden"></label><span class="text-gray-400 text-[11px]">(ឬ Copy រូបភាពរួចចុច Ctrl + V ដើម្បី Paste ក៏បាន)</span>';
              
              var fileInput = container.querySelector('input[type="file"]');
              fileInput.addEventListener('change', function(e) {
                if (!e.target.files || !e.target.files[0]) return;
                uploadFile(e.target.files[0], input);
              });
              
              input.parentNode.appendChild(container);

              // Allow paste image directly when focusing input
              input.addEventListener('paste', function(e) {
                var items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (var i = 0; i < items.length; i++) {
                  if (items[i].type.indexOf('image') !== -1) {
                    var blob = items[i].getAsFile();
                    uploadFile(blob, input);
                    e.preventDefault();
                    break;
                  }
                }
              });
            }
          });
          // Auto Broadcast Toggle Switch in Movie Form Modal
          var overviewTextarea = document.querySelector('textarea');
          if (overviewTextarea && !document.getElementById('tg-broadcast-toggle-wrapper')) {
            var toggleBox = document.createElement('div');
            toggleBox.id = 'tg-broadcast-toggle-wrapper';
            toggleBox.className = 'p-3 my-3 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-between text-left';
            toggleBox.innerHTML = 
              '<div class="flex items-center gap-2.5">' +
                '<span class="text-xl">📢</span>' +
                '<div>' +
                  '<div class="text-xs font-bold text-amber-300">ផ្ញើដំណឹងរឿងថ្មីនេះទៅ Telegram ស្វ័យប្រវត្តិ (Broadcast)</div>' +
                  '<div class="text-[11px] text-gray-400">ផ្ញើ Poster + ចំណងជើង + ប៊ូតុងទស្សនា ទៅកាន់សមាជិកទាំងអស់</div>' +
                '</div>' +
              '</div>' +
              '<label class="relative inline-flex items-center cursor-pointer ml-3 shrink-0">' +
                '<input type="checkbox" id="auto-broadcast-telegram-checkbox" class="sr-only peer" checked>' +
                '<div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[\'\'] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>' +
              '</label>';

            if (overviewTextarea.parentNode && overviewTextarea.parentNode.parentNode) {
              overviewTextarea.parentNode.parentNode.insertBefore(toggleBox, overviewTextarea.parentNode.nextSibling);
            }
          }

        });

        observer.observe(document.body, { childList: true, subtree: true });

        function uploadFile(file, targetInput) {
          var formData = new FormData();
          formData.append('poster', file);
          var originalPlaceholder = targetInput.placeholder;
          targetInput.placeholder = 'កំពុង Upload រូបភាព... សូមរង់ចាំ';
          targetInput.disabled = true;

          fetch('/admin/data/upload-poster', {
            method: 'POST',
            body: formData
          })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            targetInput.disabled = false;
            targetInput.placeholder = originalPlaceholder;
            if (data.url) {
              targetInput.value = data.url;
              targetInput.dispatchEvent(new Event('input', { bubbles: true }));
              targetInput.dispatchEvent(new Event('change', { bubbles: true }));
            }
          })
          .catch(function(err) {
            targetInput.disabled = false;
            targetInput.placeholder = originalPlaceholder;
            alert('Upload បរាជ័យ៖ ' + err.message);
          });
        }
      });
    </script>

    <script type="module" src="/build/assets/app-DkOyG5va.js"></script>
